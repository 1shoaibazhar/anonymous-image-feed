services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imagefeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imagefeed}
      POSTGRES_DB: ${POSTGRES_DB:-imagefeed}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imagefeed} -d ${POSTGRES_DB:-imagefeed}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./backend/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-imagefeed}:${POSTGRES_PASSWORD:-imagefeed}@db:5432/${POSTGRES_DB:-imagefeed}?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-imagefeed}:${POSTGRES_PASSWORD:-imagefeed}@db:5432/${POSTGRES_DB:-imagefeed}?sslmode=disable
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data: