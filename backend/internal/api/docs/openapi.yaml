openapi: 3.0.3
info:
  title: Anonymous Image Feed API
  version: "1.0"
  description: |
    REST API for the anonymous image feed.

paths:
  /api/images:
    get:
      summary: List images
      parameters:
        - name: tags
          in: query
          description: Comma separated tag names to filter by.
          schema:
            type: string
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's next_cursor.
          schema:
            type: string
      responses:
        "200":
          description: A page of images, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagesPage"
        "400":
          description: Invalid cursor.

  /api/tags:
    get:
      summary: List all tags in use
      responses:
        "200":
          description: All distinct tag names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/upload:
    post:
      summary: Upload an image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, file]
              properties:
                title:
                  type: string
                tags:
                  type: string
                  description: Comma separated tag names.
                file:
                  type: string
                  format: binary
                  description: jpeg, png or webp, up to 10MB.
      responses:
        "201":
          description: The created image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          description: Missing title/file or unsupported file type.

components:
  schemas:
    Image:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        url:
          type: string
        created_at:
          type: string
          format: date-time
    ImagesPage:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        next_cursor:
          type: string
          nullable: true
